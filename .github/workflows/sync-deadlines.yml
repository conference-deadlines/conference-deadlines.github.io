name: Sync deadlines

on:
  schedule:
    # 05:00 UTC daily, shortly after upstream's own nightly activity.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deadlines
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate conference data
        run: python scripts/sync_ccfddl.py

      - name: Commit changes
        run: |
          if git diff --quiet -- _data ical; then
            echo "No deadline changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data ical
          git commit -m "Sync deadlines from ccfddl/ccf-deadlines"
          git push
