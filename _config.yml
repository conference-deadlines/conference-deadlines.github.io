title: Research Conference Deadlines
tagline: Countdowns to paper and abstract submission deadlines for computer science conferences worldwide.
description: >-
  Paper and abstract submission deadline countdowns for 348 computer science
  conferences across ten research areas, shown in your local timezone.

url: "https://conference-deadlines.github.io"
baseurl: ""

github_org: conference-deadlines
github_repo: conference-deadlines.github.io

# GoatCounter site code -- the subdomain of <code>.goatcounter.com.
# Leave empty to disable analytics entirely (no script is loaded, no counter
# is shown). Enable "Allow adding visitor counts on your website" in the
# GoatCounter site settings for the footer figures to work.
# goatcounter_code: your-site-code

markdown: kramdown

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
